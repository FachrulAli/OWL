server {
    listen 80;
    server_name _;
    return 308 https://$host:8443$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/owl/tls/server.pem;
    ssl_certificate_key /etc/owl/tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    auth_request_set $owl_reason $upstream_http_x_owl_reason;
    error_page 403 = @owl_denied;
    location @owl_denied {
        default_type text/plain;
        return 403 "Akses ditolak: $owl_reason\n";
    }

    location = /_auth_standard {
        internal;
        proxy_pass http://backend:8000/api/access/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-OWL-Resource standard;
    }
    location = /_auth_classified {
        internal;
        proxy_pass http://backend:8000/api/access/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-OWL-Resource classified;
    }
    location = /protected/standard {
        auth_request /_auth_standard;
        alias /etc/owl/demo/system.html;
    }
    location = /protected/classified {
        auth_request /_auth_classified;
        alias /etc/owl/demo/system.html;
    }
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; }
    location = /health { proxy_pass http://backend:8000; }
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location / { try_files $uri $uri/ /index.html; }
}
