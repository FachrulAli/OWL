<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TRINETRA">
  <defs>
    <radialGradient id="iris" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#eafff9"/>
      <stop offset="34%" stop-color="#35d0ba"/>
      <stop offset="100%" stop-color="#0c4e46"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b131c"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="#173043" stroke-width="1.5"/>
  <!-- radar tick ring -->
  <g stroke="#35d0ba" stroke-width="1.4" opacity="0.55" stroke-linecap="round">
    <line x1="32" y1="6"  x2="32" y2="11"/>
    <line x1="32" y1="53" x2="32" y2="58"/>
    <line x1="6"  y1="32" x2="11" y2="32"/>
    <line x1="53" y1="32" x2="58" y2="32"/>
  </g>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#1f6a62" stroke-width="1.3" opacity="0.7"/>
  <!-- eye -->
  <path d="M11 32 Q32 12 53 32 Q32 52 11 32 Z" fill="none" stroke="#35d0ba" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="9.5" fill="url(#iris)"/>
  <circle cx="32" cy="32" r="3.6" fill="#04120f"/>
  <circle cx="29.4" cy="29" r="1.5" fill="#eafff9" opacity="0.9"/>
  <!-- third-eye marker -->
  <path d="M32 3 l4 7 h-8 Z" fill="#35d0ba" opacity="0.9"/>
</svg>
