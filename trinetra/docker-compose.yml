name: trinetra

# TRINETRA — Full-architecture stack (Kartika Cyber Hackathon 2026)
# 3-tier insider threat detection: telemetry -> ingestion -> detection -> scoring -> orchestration -> dashboard
#
#   Redpanda      Kafka-compatible event bus (ingestion & buffer)
#   ClickHouse    time-series telemetry + risk score store
#   Postgres      roles, entities, baselines meta, cases, feedback
#   ml            UEBA engine (Isolation Forest + peer-group) — scoring/training API
#   backend       ingestion consumer, OCSF normalize, enrich, rule engine, risk scoring, orchestration, REST+WS
#   simulator     synthetic telemetry generator (replaces eBPF/ETW agents for demo)
#   frontend      React command center dashboard
#
# Quick start:  docker compose up --build

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --check=false
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    image: redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8085:8080"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: trinetra
      CLICKHOUSE_USER: trinetra
      CLICKHOUSE_PASSWORD: trinetra
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ch_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trinetra
      POSTGRES_USER: trinetra
      POSTGRES_PASSWORD: trinetra
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinetra"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml:
    build: ./services/ml
    environment:
      PG_DSN: postgresql://trinetra:trinetra@postgres:5432/trinetra
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: trinetra
      CLICKHOUSE_PASSWORD: trinetra
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8001:8001"

  backend:
    build: ./services/backend
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      PG_DSN: postgresql://trinetra:trinetra@postgres:5432/trinetra
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: trinetra
      CLICKHOUSE_PASSWORD: trinetra
      ML_URL: http://ml:8001
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      ml:
        condition: service_started
    ports:
      - "8000:8000"

  simulator:
    build: ./services/simulator
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      EVENTS_PER_SECOND: "40"
      INSIDER_ANOMALY_RATE: "0.14"
      NOISE_ANOMALY_RATE: "0"
    depends_on:
      redpanda:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  ch_data:
  pg_data:
