title: Patch keamanan perangkat kedaluwarsa
name: mob_patch_stale
id: 7b1f0c42-5a11-4c0e-9c21-0a0d1e3f1016
status: stable
description: >
  Tingkat patch lebih tua dari 180 hari. Bukan serangan, melainkan POSTUR:
  perangkat ini rentan terhadap rantai eksploitasi yang sudah ditambal.
  Dipakai sebagai pengali risiko, bukan alarm.
logsource:
  product: mobile
  service: integrity
detection:
  selection:
    domain: mobile
    patch_age_days|gte: 180
  condition: selection
level: informational
tags:
  - attack.initial-access
trinetra:
  category: vulnerable_posture
  severity: 8
  stage: posture
