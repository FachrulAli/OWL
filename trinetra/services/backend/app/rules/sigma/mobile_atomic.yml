title: Penurunan paksa ke 2G tanpa enkripsi pada sel tak dikenal
name: mob_radio_downgrade
id: 7b1f0c42-5a11-4c0e-9c21-0a0d1e3f1014
status: experimental
description: >
  Perangkat dipaksa turun ke 2G, enkripsi radio mati, dan menempel pada
  cell ID yang belum pernah terlihat di wilayah itu. Pola IMSI catcher /
  BTS palsu — relevan untuk pengamanan kegiatan pimpinan di lapangan.
logsource:
  product: mobile
  service: radio
detection:
  selection:
    domain: mobile
    net_gen: 2G
    cell_unknown: 1
    cell_encryption: 0
  condition: selection
falsepositives:
  - Daerah blankspot yang memang hanya terlayani 2G
level: high
tags:
  - attack.collection
  - attack.t1430          # Location Tracking
trinetra:
  category: radio_attack
  severity: 28
  stage: radio
---
