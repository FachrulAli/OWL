title: Sertifikat CA atau konfigurasi jaringan diubah diam-diam
name: mob_ca_cert_added
id: 7b1f0c42-5a11-4c0e-9c21-0a0d1e3f1012
status: experimental
description: >
  Penambahan sertifikat CA, penimpaan DNS, atau penetapan proxy. Membuka
  jalan penyadapan TLS terhadap seluruh lalu lintas perangkat.
logsource:
  product: mobile
  service: integrity
detection:
  selection:
    domain: mobile
    tamper_detail:
      - ca_cert_added
      - dns_override
      - proxy_set
  condition: selection
level: high
tags:
  - attack.credential-access
