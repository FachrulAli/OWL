title: "Rantai zero-click via SMS biner: pengiriman, eksploitasi, denyut kendali"
name: corr_zeroclick_beacon_chain
id: 9c2e5a10-33b7-4a8d-9f10-0a0d1e3f2010
status: experimental
description: >
  Varian rantai zero-click yang TIDAK mengunggah data besar. Setelah pesan
  senyap dan crash proses parser, implan hanya mengirim denyut kendali kecil
  dan menunggu perintah. Aturan corr_zeroclick_fullchain melewatkan pola ini
  karena menuntut volume unggahan; celah itu ditutup di sini. Operator
  spyware yang sabar justru berperilaku seperti ini: volume kecil supaya
  tidak terlihat pada tagihan data maupun pemantauan trafik.
author: TRINETRA / Pussiberad Kartika Hackathon 2026
correlation:
  type: temporal_ordered
  rules:
    - mob_silent_inbound
    - mob_parser_crash_idle
    - mob_beacon_regular
  group-by:
    - entity_id
  timespan: 15m
level: critical
tags:
  - attack.initial-access
  - attack.execution
  - attack.command-and-control
  - attack.t1203
  - attack.t1437
trinetra:
  category: zero_click_exploit
  severity: 82
