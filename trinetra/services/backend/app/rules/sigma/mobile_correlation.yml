# TRINETRA: correlation rules, format Sigma correlation (spec v2).
#
# INI INTI DETEKSI ZERO-CLICK. Satu indikator perilaku di HP selalu ambigu:
# HP panas bisa karena main game, upload besar bisa karena backup, pesan dari
# nomor tak dikenal bisa karena ojol. Yang TIDAK ambigu adalah beberapa
# indikator menyala BERURUTAN, pada satu perangkat, dalam jendela waktu
# pendek, sementara pemiliknya tidak menyentuh HP sama sekali.
#
# `temporal_ordered` = kelompok aturan yang harus terjadi DALAM URUTAN
# tertentu di dalam satu rentang waktu (Sigma specification v2).
---
title: "Rantai zero-click lengkap: pengiriman, eksploitasi, eksfiltrasi"
name: corr_zeroclick_fullchain
id: 9c2e5a10-33b7-4a8d-9f10-0a0d1e3f2001
status: experimental
description: >
  Pesan senyap dari pengirim tak dikenal, diikuti crash proses parser OS,
  diikuti unggahan data keluar. Ketiganya pada satu perangkat dalam 10 menit
  sementara perangkat idle. Ini bentuk permukaan dari rantai eksploitasi
  zero-click dan praktis tidak punya padanan sah.
author: TRINETRA / Pussiberad Kartika Hackathon 2026
correlation:
  type: temporal_ordered
  rules:
    - mob_silent_inbound
    - mob_parser_crash_idle
    - mob_covert_egress_idle
  group-by:
    - entity_id
  timespan: 10m
level: critical
tags:
  - attack.initial-access
  - attack.execution
  - attack.exfiltration
  - attack.t1203
trinetra:
  category: zero_click_exploit
  severity: 85
  kill_chain: [delivery, exploit, c2]
  response: isolate
---
