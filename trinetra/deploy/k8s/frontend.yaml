apiVersion: apps/v1
kind: Deployment
metadata:
  name: trinetra-frontend
  labels: { app: trinetra-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: trinetra-frontend }
  template:
    metadata:
      labels: { app: trinetra-frontend }
    spec:
      containers:
        - name: frontend
          image: REGISTRY/trinetra-frontend:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: trinetra-frontend
spec:
  type: LoadBalancer
  selector: { app: trinetra-frontend }
  ports:
    - { port: 80, targetPort: 80 }
