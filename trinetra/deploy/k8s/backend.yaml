apiVersion: apps/v1
kind: Deployment
metadata:
  name: trinetra-backend
  labels: { app: trinetra-backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: trinetra-backend }
  template:
    metadata:
      labels: { app: trinetra-backend }
    spec:
      containers:
        - name: backend
          image: REGISTRY/trinetra-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: trinetra-infra }
          env:
            - { name: ML_URL, value: "http://trinetra-ml:8001" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: trinetra-backend
spec:
  selector: { app: trinetra-backend }
  ports:
    - { port: 8000, targetPort: 8000 }
